id: lab-portal-admin
info:
  name: Portal ficticio - aluno acessa resumo administrativo
  author: atividade-seguranca-redes
  severity: high
  description: Autentica como aluno e verifica dados exclusivos da administracao.
  tags: portal,authorization,access-control
http:
  - raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"login":"ana","senha":"CampusLab!2026"}
      - |
        GET /api/admin/resumo HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && contains(body_1, "\"papel\":\"aluno\"") && status_code_2 == 200 && contains(body_2, "LAB_ADMIN_EXPOSTO")'
